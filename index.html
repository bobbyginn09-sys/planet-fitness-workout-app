    /* NEXSET 3.2.0 — premium motion and tactile polish */
    #view.view-enter { animation: nexsetViewIn .32s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes nexsetViewIn { from { opacity:0; transform:translateY(8px) scale(.995); } to { opacity:1; transform:none; } }
    .btn,.icon-btn,.mini-action,.nav-btn,.weight-add,.quick-square button,.plan-week-tabs button {
      transition: transform .16s ease, filter .16s ease, border-color .2s ease, background-color .2s ease, box-shadow .2s ease;
      touch-action: manipulation;
    }
    .btn:active,.icon-btn:active,.mini-action:active,.weight-add:active,.quick-square button:active,.plan-week-tabs button:active { transform:scale(.965); filter:brightness(.94); }
    .nav-btn:active { transform:translateY(1px) scale(.96); }
    .btn.primary { box-shadow:0 12px 30px rgba(67,83,255,.24), inset 0 1px 0 rgba(255,255,255,.2); }
    .btn.primary:hover { box-shadow:0 16px 38px rgba(67,83,255,.32), inset 0 1px 0 rgba(255,255,255,.22); }
    .today-card { position:relative; isolation:isolate; }
    .today-card::after { content:"";position:absolute;inset:auto -18% -42% 28%;height:62%;z-index:-1;background:radial-gradient(circle,rgba(91,74,255,.22),transparent 67%);pointer-events:none; }
    .today-mark { position:relative; overflow:hidden; }
    .today-mark::after { content:"";position:absolute;inset:-45%;background:linear-gradient(115deg,transparent 36%,rgba(255,255,255,.20) 50%,transparent 64%);transform:translateX(-55%) rotate(8deg);animation:nexsetSheen 5.5s ease-in-out infinite; }
    @keyframes nexsetSheen { 0%,62%{transform:translateX(-65%) rotate(8deg)} 82%,100%{transform:translateX(65%) rotate(8deg)} }
    .today-mark svg { width:62%;height:62%;filter:drop-shadow(0 6px 13px rgba(60,99,255,.35)); }
    .brand-mark img { image-rendering:auto;filter:drop-shadow(0 4px 8px rgba(64,93,255,.26));transform:translateZ(0); }
    .week-dots i { transform:scale(.82); transition:transform .25s cubic-bezier(.2,.8,.2,1), background .25s ease, box-shadow .25s ease; }
    .week-dots i.done { transform:scale(1);box-shadow:0 0 0 3px rgba(34,197,94,.08),0 0 12px rgba(34,197,94,.36); }
    .week-dots i.today { transform:scale(1.08);animation:nexsetPulse 2.4s ease-in-out infinite; }
    @keyframes nexsetPulse { 0%,100%{box-shadow:0 0 0 0 rgba(59,130,246,.25)} 50%{box-shadow:0 0 0 5px rgba(59,130,246,0)} }
    .card,.coach-compact,.snapshot-card { transition:border-color .22s ease,transform .22s ease,box-shadow .22s ease; }
    @media (hover:hover) { .card:hover,.coach-compact:hover,.snapshot-card:hover { border-color:rgba(91,124,255,.28);transform:translateY(-1px); } }
    .completion-burst { animation:completionPop .5s cubic-bezier(.2,.9,.2,1) both; }
    @keyframes completionPop { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:scale(1)} }
    @media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important;animation:none !important;transition:none !important; } }


    /* =========================================================
       NEXSET 3.2.0 — professional brand + iPhone-first layout
       ========================================================= */
    :root {
      --bg:#060A11; --bg2:#0C121B; --surface:#101722; --surface2:#161F2B; --surface3:#1E2938;
      --text:#F7F9FC; --muted:#8FA0B6; --line:rgba(139,149,167,.18);
      --blue:#1FA2FF; --purple:#0D7DFF; --green:#22C55E; --cyan:#6EC4FF; --orange:#F59E0B; --red:#EF4444;
      --brand-gradient:linear-gradient(115deg,#1FA2FF 0%,#0D7DFF 48%,#005DE8 100%);
      --shadow:0 18px 50px rgba(0,0,0,.34); --header-h:62px; --nav-h:72px;
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,sans-serif;
    }
    :root[data-theme="light"] { --bg:#F3F6FB;--bg2:#FFFFFF;--surface:#FFFFFF;--surface2:#EDF1F7;--surface3:#E4EAF2;--text:#0E1117;--muted:#667085;--line:rgba(14,17,23,.12); }
    body { background:radial-gradient(circle at 10% -8%,rgba(31,162,255,.17),transparent 26rem),radial-gradient(circle at 100% 8%,rgba(13,125,255,.11),transparent 24rem),linear-gradient(165deg,var(--bg),var(--bg2)); padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 10px); }
    h1,h2,h3 { font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif; }
    h1 { letter-spacing:-.055em; }
    .shell { width:min(680px,calc(100% - 24px)); }
    .app-header { background:color-mix(in srgb,var(--bg) 91%,transparent); border-color:rgba(139,149,167,.12); }
    .header-inner { min-height:var(--header-h); }
    .brand { gap:10px; }
    .brand-mark { width:40px;height:40px;border-radius:13px;padding:4px;background:linear-gradient(145deg,#131B2B,#090D16);border:1px solid rgba(139,149,167,.2);box-shadow:0 10px 26px rgba(13,125,255,.16); }
    .brand-mark img { width:100%;height:100%;object-fit:contain; }
    .brand-title { font-size:19px;letter-spacing:.15em;font-weight:900; }
    .brand-sub { font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted); }
    .version-badge { margin-left:5px;padding:2px 6px;font-size:9px;letter-spacing:.06em;color:#C9E5FF;background:rgba(13,125,255,.12);border-color:rgba(13,125,255,.28);vertical-align:3px; }
    .icon-btn { width:40px;height:40px;border-radius:13px;background:var(--surface2); }
    .icon-btn svg { width:21px;height:21px;fill:currentColor; }
    .main { padding:12px 0 24px; }
    .card { background:linear-gradient(155deg,color-mix(in srgb,var(--surface) 96%,transparent),color-mix(in srgb,var(--surface2) 76%,transparent));border-radius:24px; }
    .card-pad { padding:18px; }
    .btn { border-radius:15px;min-height:48px; }
    .btn.primary { background:var(--brand-gradient);box-shadow:0 14px 30px rgba(13,125,255,.22); }
    .btn.subtle { background:var(--surface2);border-color:var(--line); }
    .eyebrow,.section-kicker { color:var(--blue);font-size:10px;font-weight:850;text-transform:uppercase;letter-spacing:.14em; }

    /* Home — one-screen dashboard on modern iPhones */
    .home-screen { min-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - var(--header-h) - var(--nav-h) - 34px);display:flex;flex-direction:column;gap:11px; }
    .home-greeting { display:flex;align-items:flex-end;justify-content:space-between;padding:2px 3px 1px; }

    .home-status { padding:6px 10px;border-radius:999px;color:#A7F3D0;background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.26);font-size:11px!important;font-weight:850; }
    .home-status.rest { color:#BFD4FF;background:rgba(37,99,255,.1);border-color:rgba(37,99,255,.25); }
    .today-card { position:relative;overflow:hidden;padding:18px;border:1px solid rgba(91,111,255,.25);border-radius:25px;background:radial-gradient(circle at 100% 0%,rgba(13,125,255,.18),transparent 15rem),radial-gradient(circle at 0 100%,rgba(31,162,255,.17),transparent 17rem),linear-gradient(155deg,#141B28,#0D131D);box-shadow:var(--shadow); }
    .today-card::after { content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }

    .coach-compact { padding:14px 15px;border-radius:21px;background:var(--surface);border:1px solid var(--line); }

    .mini-action { width:35px;height:35px;border-radius:12px;background:rgba(37,99,255,.1);border:1px solid rgba(37,99,255,.25);color:#8CB2FF;font-size:17px; }

    .home-bottom-grid { display:grid;grid-template-columns:1fr 1fr 65px;gap:9px;min-height:92px; }

    .snapshot-card>strong { display:block;font-size:24px;line-height:1.05;margin-top:5px;letter-spacing:-.045em; }

    .weight-card { position:relative;padding:0;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 42px;align-items:stretch; }

    /* Legacy visual base retained beneath the NEXSET 3.5.0 Signature UI layer. */
    :root {
      --premium-blue:#179DFF;
      --premium-blue-deep:#0069F4;
      --premium-navy:#0B1420;
      --premium-red:#FF353F;
      --premium-line:rgba(151,178,208,.15);
    }
    body {
      background:
        radial-gradient(circle at 50% -16%,rgba(25,157,255,.12),transparent 28rem),
        radial-gradient(circle at 105% 22%,rgba(0,80,180,.09),transparent 22rem),
        linear-gradient(180deg,#02070D 0%,#040A12 46%,#02060B 100%);
    }
    .shell{width:min(680px,calc(100% - 24px));}
    .app-header{background:rgba(2,7,13,.86);border-bottom-color:rgba(145,174,205,.11);backdrop-filter:blur(28px) saturate(145%);}
    .header-inner{min-height:68px;}
    .brand-lockup{width:138px;height:auto;display:block;}
    .header-alert{width:42px;height:42px;border-radius:14px;background:linear-gradient(155deg,#151F2C,#0B121B);border-color:rgba(150,179,209,.18);box-shadow:0 10px 28px rgba(0,0,0,.22),inset 0 1px rgba(255,255,255,.035);}
    .header-alert svg{width:20px;height:20px;fill:none;stroke:#E7EDF6;stroke-width:1.55;}
    .header-alert-dot{display:none!important;}
    .main{padding:14px 0 38px;}
    .home-dashboard{gap:13px;}
    .home-welcome{padding:3px 5px 0;}
    .home-welcome h1{font-size:clamp(28px,7.7vw,35px);line-height:1;letter-spacing:-.052em;margin-bottom:4px;}
    .home-welcome p{font-size:13px;color:#8391A4;}

    .reference-today-card,
    .reference-today-card.mode-legs-a,
    .reference-today-card.mode-legs-b{
      min-height:282px;padding:21px 18px 80px;border-radius:28px;
      background:
        linear-gradient(105deg,rgba(13,26,42,.98) 0%,rgba(11,23,39,.96) 49%,rgba(18,20,31,.94) 100%);
      border:1px solid rgba(121,158,197,.24);
      box-shadow:0 24px 60px rgba(0,0,0,.42),inset 0 1px rgba(255,255,255,.045);
      isolation:isolate;
    }
    .reference-today-card::before{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;
      background:
        radial-gradient(circle at 79% 41%,rgba(255,43,51,.105),transparent 8.5rem),
        radial-gradient(circle at 18% 12%,rgba(25,157,255,.17),transparent 12rem),
        linear-gradient(115deg,rgba(255,255,255,.025),transparent 38%);
    }
    .reference-today-card::after{
      content:"";position:absolute;inset:0;z-index:0;pointer-events:none;border-radius:inherit;opacity:.19;
      background-image:linear-gradient(rgba(128,160,195,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(128,160,195,.055) 1px,transparent 1px);
      background-size:27px 27px;mask-image:linear-gradient(90deg,transparent 28%,#000 100%);
    }
    .today-card-content,.reference-today-card.mode-legs-a .today-card-content,.reference-today-card.mode-legs-b .today-card-content,.reference-today-card.is-rest .today-card-content{max-width:61%;z-index:4;}
    .today-kicker{display:flex;align-items:center;gap:7px;margin-bottom:10px;text-transform:uppercase;letter-spacing:.14em;font-size:10px;font-weight:900;color:#65BCFF;}
    .today-kicker b{padding:4px 7px;border-radius:999px;background:rgba(23,157,255,.12);border:1px solid rgba(23,157,255,.22);font-size:8px;letter-spacing:.10em;color:#BFE5FF;}
    .reference-today-card h2{font-size:clamp(38px,10vw,49px);line-height:.94;letter-spacing:-.06em;margin:0 0 9px;}

    .today-detail-list{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px;}
    .today-detail-list span{min-height:29px;padding:6px 9px;border-radius:10px;background:rgba(4,10,17,.46);border:1px solid rgba(154,180,208,.13);font-size:9.5px;color:#C1CDDC;backdrop-filter:blur(8px);}
    .today-detail-list svg{width:13px;height:13px;color:#6DBBFF;}
    .reference-today-card .today-actions{left:14px;right:14px;bottom:14px;z-index:5;}
    .home-start{min-height:58px;border-radius:16px;background:linear-gradient(135deg,#23A8FF 0%,#0879FA 52%,#0055DE 100%)!important;box-shadow:0 16px 34px rgba(0,94,230,.36),inset 0 1px rgba(255,255,255,.17);font-size:14px;letter-spacing:.02em;}

    .anatomy-figure{display:grid;place-items:center;position:relative;isolation:isolate;pointer-events:none;}

    .reference-today-card>.anatomy-figure.hero{position:absolute;right:-4px;top:7px;z-index:3;width:168px;height:218px;}
    .reference-today-card>.anatomy-figure.hero.mode-legs-a,.reference-today-card>.anatomy-figure.hero.mode-legs-b{right:-1px;top:7px;width:160px;height:224px;}

    .anatomy-glow{position:absolute;z-index:1;width:86%;height:72%;top:14%;left:8%;border-radius:50%;background:radial-gradient(circle,rgba(255,48,56,.20),rgba(255,48,56,.06) 46%,transparent 72%);filter:blur(15px);}

    .anatomy-label{display:none;position:absolute;z-index:4;right:8px;bottom:3px;max-width:138px;padding:5px 9px;border-radius:999px;background:rgba(2,7,13,.72);border:1px solid rgba(255,255,255,.12);color:#E8EEF7;font-size:7px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;backdrop-filter:blur(10px);}
    .anatomy-figure.compact{width:44px!important;height:54px!important;border-radius:12px;background:linear-gradient(155deg,#111A25,#080D14);border:1px solid rgba(148,177,208,.15);overflow:hidden;}

    .anatomy-figure.compact.mode-legs-a img,.anatomy-figure.compact.mode-legs-b img,.anatomy-figure.compact.mode-recovery img{width:78%;}
    .anatomy-figure.compact .anatomy-glow{filter:blur(7px);opacity:.75;}

    /* NEXSET 3.5.0 — Signature UI */
    :root{
      --sig-blue:#149EFF;
      --sig-blue-2:#006BFF;
      --sig-cyan:#62C8FF;
      --sig-bg:#02060B;
      --sig-surface:#09121C;
      --sig-surface-2:#0D1824;
      --sig-line:rgba(255,255,255,.085);
      --sig-soft:rgba(255,255,255,.055);
      --sig-text:#F4F7FB;
      --sig-muted:#8998AA;
    }
    html,body{background:var(--sig-bg);}
    body{background:
      radial-gradient(circle at 50% -12%,rgba(17,136,255,.09),transparent 23rem),
      linear-gradient(180deg,#030910 0%,#02060B 50%,#010408 100%);
      color:var(--sig-text);
    }
    .shell{width:min(680px,calc(100% - 24px));}
    .main{padding-top:12px;padding-bottom:calc(var(--nav-h) + var(--safe-bottom) + 20px);}
    .app-header{background:rgba(2,6,11,.88);border-bottom:1px solid rgba(255,255,255,.065);backdrop-filter:blur(28px) saturate(140%);box-shadow:none;}
    .header-inner{min-height:64px;padding-inline:5px;}
    .brand-lockup{width:148px!important;height:31px!important;}
    .icon-btn{width:42px;height:42px;border-radius:14px;background:linear-gradient(150deg,rgba(19,31,45,.96),rgba(7,13,21,.96));border-color:rgba(255,255,255,.10);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 10px 24px rgba(0,0,0,.22);}

    .bottom-nav{padding:7px 12px calc(8px + var(--safe-bottom));background:rgba(2,6,11,.90);border-top:1px solid rgba(255,255,255,.07);backdrop-filter:blur(30px) saturate(145%);box-shadow:0 -14px 34px rgba(0,0,0,.36);}
    .nav-inner{gap:8px;width:min(620px,100%);}
    .nav-btn{min-height:57px;border-radius:16px;color:#718196;transition:transform .16s ease,color .16s ease,background .16s ease;}
    .nav-btn>span:last-child{font-size:10px;font-weight:720;letter-spacing:.01em;}
    .nav-btn.active{color:var(--sig-blue);background:linear-gradient(180deg,rgba(20,158,255,.10),rgba(20,158,255,.015));}
    .nav-btn.active::before{content:"";position:absolute;top:0;width:29px;height:2px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--sig-cyan),var(--sig-blue-2));box-shadow:0 0 12px rgba(20,158,255,.7);}
    .nav-btn{position:relative;}

    /* Shared anatomy presentation */
    .anatomy-figure{position:relative;display:block;pointer-events:none;isolation:isolate;}
    .anatomy-figure img{position:relative;z-index:2;width:100%;height:100%;object-fit:contain;object-position:center top;filter:drop-shadow(0 18px 24px rgba(0,0,0,.58));}
    .anatomy-figure .anatomy-aura{position:absolute;z-index:0;left:50%;top:45%;width:86%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(23,140,255,.17),rgba(8,45,83,.07) 45%,transparent 72%);filter:blur(2px);}
    .anatomy-figure .anatomy-floor{position:absolute;z-index:1;left:16%;right:16%;bottom:2%;height:7%;border-radius:50%;background:radial-gradient(ellipse,rgba(17,129,255,.28),transparent 68%);filter:blur(8px);}
    .anatomy-figure.compact .anatomy-aura,.anatomy-figure.compact .anatomy-floor{display:none;}

    /* Home */
    .signature-home{display:grid;gap:12px;padding-bottom:8px;}
    .signature-greeting{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:7px 4px 1px;}

    function validateBackup(parsed){

    function importBackup(file){

}

function nexset360CardioTargetText(ex, progress = {}) {
  const config = nexset343CardioConfig(ex);
  const duration = nexset360Number(progress.nextDuration, nexset360Number(ex?.coachCardio?.duration, ex?.min || 10));
  if (config.mode === 'treadmill') {
    const speed = nexset360Number(progress.nextSpeed, nexset360Number(ex?.coachCardio?.speed, config.speedMin));
    const incline = nexset360Number(progress.nextIncline, nexset360Number(ex?.coachCardio?.incline, config.inclineMin));
    return `${cleanNumber(duration)} min at ${cleanNumber(speed)} mph and ${cleanNumber(incline)}% incline`;
  }
  if (config.mode === 'stair') {
    const level = nexset360Number(progress.nextLevel, nexset360Number(ex?.coachCardio?.level, config.levelMin));
    return `${cleanNumber(duration)} min at level ${cleanNumber(level)}`;
  }
  if (config.mode === 'interval') {
    const rounds = Math.max(1, Math.round(nexset360Number(progress.nextRounds, nexset360Number(ex?.coachCardio?.rounds, config.roundsMin))));
    const jog = nexset360Number(progress.nextJogSpeed, nexset360Number(ex?.coachCardio?.jogSpeed, config.jogSpeedMin));
    const walk = nexset360Number(progress.nextWalkSpeed, nexset360Number(ex?.coachCardio?.walkSpeed, config.walkSpeedMin));
    const incline = nexset360Number(progress.nextIncline, nexset360Number(ex?.coachCardio?.incline, config.inclineMin));
    const total = nexset360IntervalDuration(config, rounds);
    return `${rounds} rounds (${cleanNumber(total)} min): ${cleanNumber(jog)} mph jog / ${cleanNumber(walk)} mph walk at ${cleanNumber(incline)}%`;
  }
  return `${cleanNumber(duration)} ${ex?.unit || 'min'}`;
}

function nexset360SeedRecommendations(plan, force = false) {
  state.exerciseProgress = state.exerciseProgress || {};
  for (const day of plan || []) {
    for (const ex of day.exercises || []) {
      const directProgress = state.exerciseProgress[ex.id];
      const aliasProgress = exerciseAliases(ex.id).slice(1).map(id => state.exerciseProgress[id]).find(Boolean);
      const inheritedSeedOnly = !directProgress && Boolean(aliasProgress)
        && !Number(aliasProgress.completedCount)
        && !Number.isFinite(Number(aliasProgress.lastWeight))
        && !aliasProgress.lastDate;
      const progress = directProgress || (aliasProgress ? { ...aliasProgress } : {});
      if (ex.type === 'weighted' && Number.isFinite(Number(ex.coachWeight))) {
        if (force || !Number.isFinite(Number(progress.nextWeight)) || inheritedSeedOnly) progress.nextWeight = Number(ex.coachWeight);
        if (force || !progress.note || inheritedSeedOnly) progress.note = `Start at ${formatWeightValue(progress.nextWeight)}. Increase only after every working set reaches the top of the rep range without a hard rating.`;
      }
      if (ex.type === 'cardio' && ex.coachCardio) {
        const target = ex.coachCardio;
        if (force || !Number.isFinite(Number(progress.nextDuration))) progress.nextDuration = Number(target.duration || ex.min);
        if (Number.isFinite(Number(target.speed)) && (force || !Number.isFinite(Number(progress.nextSpeed)))) progress.nextSpeed = Number(target.speed);
        if (Number.isFinite(Number(target.incline)) && (force || !Number.isFinite(Number(progress.nextIncline)))) progress.nextIncline = Number(target.incline);
        if (Number.isFinite(Number(target.level)) && (force || !Number.isFinite(Number(progress.nextLevel)))) progress.nextLevel = Number(target.level);
        if (Number.isFinite(Number(target.rounds)) && (force || !Number.isFinite(Number(progress.nextRounds)))) progress.nextRounds = Number(target.rounds);
        if (Number.isFinite(Number(target.jogSpeed)) && (force || !Number.isFinite(Number(progress.nextJogSpeed)))) progress.nextJogSpeed = Number(target.jogSpeed);
        if (Number.isFinite(Number(target.walkSpeed)) && (force || !Number.isFinite(Number(progress.nextWalkSpeed)))) progress.nextWalkSpeed = Number(target.walkSpeed);
        if (!Number.isFinite(Number(progress.cardioControlledStreak))) progress.cardioControlledStreak = 0;
        if (force || !progress.note) progress.note = `Next cardio target: ${nexset360CardioTargetText(ex, progress)}. Progress one variable only after two controlled completions.`;
      }
      state.exerciseProgress[ex.id] = progress;
    }
  }
}

function nexset360ApplyPlanMigration() {

function normalizeActiveSession(session, ...args) {
  const normalized = normalizeActiveSessionBase350(session, ...args);
  if (!normalized || !Array.isArray(normalized.exercises)) return normalized;
  const raw = Array.isArray(session?.exercises) ? session.exercises : [];
  normalized.exercises.forEach((entry, index) => {
    const source = raw.find(item => item?.id === entry.id) || raw[index] || {};
    for (const key of ['draftRounds','draftJogSpeed','draftWalkSpeed']) {
      const value = Number(source[key]);
      if (Number.isFinite(value)) entry[key] = value;
    }
    const ex = entryExercise(entry);
    const config = nexset343CardioConfig(ex);
    if (config.mode === 'interval' && Number.isFinite(Number(entry.draftRounds))) entry.draftReps = nexset360IntervalDuration(config, entry.draftRounds);

}

function makeActiveEntry(ex, ...args) {

}

function nexset360RenderCardioPrescription(ex, entry, config) {
  if (config.mode === 'interval') {

  }
  return `<div class="cardio-prescription"><div class="cardio-prescription-title"><span>Today’s prescription</span><strong>${cleanNumber(entry.draftReps || ex.min)} ${esc(ex.unit || 'min')}</strong></div>${nexset360PhaseRow('Effort','Keep the pace controlled and finish able to do a little more.')}</div>`;

function nexset343AdjustCardio(kind, delta) {
  if (!active) return;
  syncDraftFromInputs();
  const entry = active.exercises?.[active.currentExerciseIndex];
  const ex = entryExercise(entry);
  if (!entry || ex?.type !== 'cardio') return;
  const config = nexset343CardioConfig(ex);
  if (kind === 'cardio-speed') entry.draftSpeed = clamp(nexset360Round(nexset360Number(entry.draftSpeed, config.speedMin) + Number(delta), config.speedStep), 0, config.speedMax || 20);
  else if (kind === 'cardio-incline') entry.draftIncline = clamp(nexset360Round(nexset360Number(entry.draftIncline, config.inclineMin) + Number(delta), config.inclineStep), 0, config.inclineMax ?? 20);
  else if (kind === 'cardio-level') entry.draftLevel = clamp(nexset360Round(nexset360Number(entry.draftLevel, config.levelMin) + Number(delta), config.levelStep), 1, config.levelMax || 20);
  else if (kind === 'cardio-rounds') entry.draftRounds = clamp(Math.round(nexset360Number(entry.draftRounds, config.roundsMin) + Number(delta)), config.roundsMin, config.roundsMax);
  else if (kind === 'cardio-jog-speed') entry.draftJogSpeed = clamp(nexset360Round(nexset360Number(entry.draftJogSpeed, config.jogSpeedMin) + Number(delta), config.jogSpeedStep), config.jogSpeedMin, config.jogSpeedMax);
  else if (kind === 'cardio-walk-speed') entry.draftWalkSpeed = clamp(nexset360Round(nexset360Number(entry.draftWalkSpeed, config.walkSpeedMin) + Number(delta), config.walkSpeedStep), config.walkSpeedMin, config.walkSpeedMax);
  if (config.mode === 'interval') entry.draftReps = nexset360IntervalDuration(config, entry.draftRounds);
  saveActive({ reason:'cardio-adjust-360' });
  renderFocusWorkout();
}

function logSet() {
  if (!active) return;
  syncDraftFromInputs();
  const index = active.currentExerciseIndex;
  const entry = active.exercises?.[index];
  const ex = entryExercise(entry);
  if (ex?.type !== 'cardio') return logSetBase343();
  const config = nexset343CardioConfig(ex);
  let duration = Number(entry.draftReps);
  const log = { feel:entry.draftFeel || 'good', at:new Date().toISOString() };
  if (config.mode === 'interval') {
    const rounds = Math.round(Number(entry.draftRounds));
    const jogSpeed = Number(entry.draftJogSpeed), walkSpeed = Number(entry.draftWalkSpeed), incline = Number(entry.draftIncline);
    if (!Number.isFinite(rounds) || rounds < config.roundsMin || !Number.isFinite(jogSpeed) || !Number.isFinite(walkSpeed) || !Number.isFinite(incline)) {
      showToast('Enter the interval rounds, speeds, and incline.'); return;
    }
    duration = nexset360IntervalDuration(config, rounds);
    Object.assign(log,{duration,rounds,jogSpeed,walkSpeed,incline,runMinutes:config.runMinutes,walkMinutes:config.walkMinutes,warmupMinutes:config.warmupMinutes,cooldownMinutes:config.cooldownMinutes,distance:nexset360EstimateIntervalDistance(config,{rounds,jogSpeed,walkSpeed})});
  } else {
    if (!Number.isFinite(duration) || duration <= 0) { showToast('Enter cardio time.'); return; }
    log.duration = duration;
    if (config.mode === 'treadmill') {
      const speed = Number(entry.draftSpeed), incline = Number(entry.draftIncline);
      if (!Number.isFinite(speed) || speed <= 0 || !Number.isFinite(incline) || incline < 0) { showToast('Enter treadmill speed and incline.'); return; }
      Object.assign(log,{speed,incline,distance:Math.round((duration * speed / 60) * 100) / 100});
    } else if (config.mode === 'stair') {
      const level = Number(entry.draftLevel);
      if (!Number.isFinite(level) || level < 1) { showToast('Enter a stair-climber level.'); return; }
      log.level = level;
    }
  }
  entry.logs.push(log);
  entry.draftFeel = 'good';
  const shouldAutoFinish = nexset350CanAutoFinishCardio(index, entry, ex);

  const finishingSessionId = active.id;
  saveActive({ reason:shouldAutoFinish?'final-cardio-ready-360':'cardio-log-360' });

    queueMicrotask(() => {
      if (!active || active.id !== finishingSessionId) return;

        showToast('Cardio saved. Tap Finish Workout to complete.');

    return;
  }
  renderFocusWorkout();
  showToast(`${ex.name} logged.`);
}

function nexset360CardioTargetMet(ex, last, previous, config) {
  const tolerance = .011;
  const durationTarget = nexset360Number(previous?.nextDuration, nexset360Number(ex?.coachCardio?.duration, ex.min));
  if (nexset360Number(last.duration, 0) + tolerance < durationTarget) return false;
  if (config.mode === 'treadmill') {
    if (nexset360Number(last.speed, 0) + tolerance < nexset360Number(previous?.nextSpeed, nexset360Number(ex?.coachCardio?.speed, config.speedMin))) return false;
    if (nexset360Number(last.incline, 0) + tolerance < nexset360Number(previous?.nextIncline, nexset360Number(ex?.coachCardio?.incline, config.inclineMin))) return false;
  } else if (config.mode === 'stair') {
    if (nexset360Number(last.level, 0) + tolerance < nexset360Number(previous?.nextLevel, nexset360Number(ex?.coachCardio?.level, config.levelMin))) return false;
  } else if (config.mode === 'interval') {
    if (nexset360Number(last.rounds, 0) < nexset360Number(previous?.nextRounds, nexset360Number(ex?.coachCardio?.rounds, config.roundsMin))) return false;
    if (nexset360Number(last.jogSpeed, 0) + tolerance < nexset360Number(previous?.nextJogSpeed, nexset360Number(ex?.coachCardio?.jogSpeed, config.jogSpeedMin))) return false;
    if (nexset360Number(last.walkSpeed, 0) + tolerance < nexset360Number(previous?.nextWalkSpeed, nexset360Number(ex?.coachCardio?.walkSpeed, config.walkSpeedMin))) return false;
  }
  return true;
}

function analyzeExercise(ex, logs, previous = {}) {
  const clean = logs || [];
  const base = { lastDate:new Date().toISOString(), completedCount:(previous.completedCount || 0) + 1, lastSummary:clean.map(log => formatLogShort(ex, log)).join(', ') };
  if (ex?.type === 'cardio') {
    const source = clean.filter(log => Number.isFinite(Number(log.duration)));
    const last = source.at(-1);
    if (!last) return { ...previous, ...base };
    const config = nexset343CardioConfig(ex);
    const targetMet = nexset360CardioTargetMet(ex,last,previous,config);
    const controlled = last.feel !== 'hard' && targetMet;
    let streak = controlled ? (Number(previous.cardioControlledStreak) || 0) + 1 : 0;
    const earnedProgression = streak >= 2;
    if (earnedProgression) streak = 0;
    let nextDuration = nexset360Number(last.duration, ex.min);
    let nextSpeed = nexset360Number(last.speed, nexset360Number(previous.nextSpeed, config.speedMin));
    let nextIncline = nexset360Number(last.incline, nexset360Number(previous.nextIncline, config.inclineMin));
    let nextLevel = nexset360Number(last.level, nexset360Number(previous.nextLevel, config.levelMin));
    let nextRounds = Math.max(1, Math.round(nexset360Number(last.rounds, nexset360Number(previous.nextRounds, config.roundsMin || 1))));
    let nextJogSpeed = nexset360Number(last.jogSpeed, nexset360Number(previous.nextJogSpeed, config.jogSpeedMin));
    let nextWalkSpeed = nexset360Number(last.walkSpeed, nexset360Number(previous.nextWalkSpeed, config.walkSpeedMin));
    if (earnedProgression) {
      if (config.mode === 'interval') {
        if (nextRounds < config.roundsMax) nextRounds += config.roundsStep;
        else if (nextJogSpeed < config.jogSpeedMax) nextJogSpeed = Math.min(config.jogSpeedMax,nexset360Round(nextJogSpeed + config.jogSpeedStep,config.jogSpeedStep));
        else if (nextIncline < config.inclineMax) nextIncline = Math.min(config.inclineMax,nexset360Round(nextIncline + config.inclineStep,config.inclineStep));
        nextDuration = nexset360IntervalDuration(config,nextRounds);
      } else if (nextDuration < ex.max) nextDuration = Math.min(ex.max, nextDuration + (Number(ex.increment) || 2));

function calculateStreak(kind = 'consistency') {
  const sessions = kind === 'strength'
    ? state.history.filter(nexset360IsStrengthSession)
    : state.history.filter(session => !nexset360IsMissedSession(session));
  const dates = new Set(sessions.map(session=>dateKey(session.startedAt)));
  let cursor = new Date(), count = 0;
  if (!dates.has(dateKey(cursor))) cursor.setDate(cursor.getDate()-1);

}

  lines.push('',`WINS`,...(review.wins.length?review.wins.map(item=>`- ${item}`):['- Baseline still collecting.']),'',`NEXT ADJUSTMENTS`,...review.adjustments.map(item=>`- ${item}`),'',`COACHING REQUEST`,`Review this week and adjust the rolling plan for fat loss, muscle definition, recovery, and running progress. Do not add nutrition tracking yet.`);
  lines.push('',`--- NEXSET_DATA_JSON ---`,JSON.stringify({schema:'nexset-weekly-file-v1',appVersion:APP_VERSION_LABEL,generatedAt:new Date().toISOString(),review,sessions:sessions.map(nexset360SessionPayload),nextWorkout:{index:state.settings.currentDayIndex,...getDay()}},null,2),`--- END_NEXSET_DATA_JSON ---`);
  return lines.join('\n');
}

function nexset360Filename(title) {

}
async function shareText(text, title, forceDownload = false) {

  try {
    const file=new File([text],filename,{type:'text/plain'});
    const canShareFiles=Boolean(navigator.share)&&(!navigator.canShare||navigator.canShare({files:[file]}));
    if (canShareFiles) {
      await navigator.share({title,text:'NEXSET coach file attached.',files:[file]});

  }
}

/* NEXSET 4.0.0 — personal intelligence, recovery, records, reports, guided cardio, and photo tracking */
const NEXSET_400_VERSION = '4.1.0';
const NEXSET_400_PHOTO_DB = 'nexset-progress-photos-v1';
const NEXSET_400_PHOTO_STORE = 'photos';
const NEXSET_400_MAX_PHOTOS = 40;
let nexset400CardioInterval = null;
let nexset400CardioPhaseIndex = -1;
let nexset400PhotoUrls = [];
let nexset400PhotoCompare = { beforeId:null, afterId:null };
let nexset400ReadinessDraft = null;
let nexset400StartModifier = null;

function nexset400Id(prefix='n4') {
  return crypto.randomUUID ? crypto.randomUUID() : `${prefix}-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}
function nexset400DaysAgo(value) {
  const time = new Date(value).getTime();
  return Number.isFinite(time) ? Math.max(0, (Date.now()-time)/86400000) : Infinity;
}
function nexset400HoursAgo(value) {
  const time = new Date(value).getTime();
  return Number.isFinite(time) ? Math.max(0, (Date.now()-time)/3600000) : Infinity;
}
function nexset400Percent(value) { return clamp(Math.round(Number(value)||0),0,100); }
function nexset400SafeArray(value) { return Array.isArray(value) ? value : []; }
function nexset400CleanText(value, max=1000) { return String(value||'').trim().slice(0,max); }
function nexset400StatusText(status) {
  if (!status) return '';
  return status.note || status.label || 'Reduced training mode';
}
function nexset400DisplayDate(value) {
  const date = new Date(value);
  return Number.isFinite(date.getTime()) ? date.toLocaleDateString(undefined,{month:'short',day:'numeric'}) : 'Unknown';
}
function nexset400LatestStrengthSession(history=state.history) {
  return [...history].filter(nexset360IsStrengthSession).sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))[0] || null;
}
function nexset400RecentStrengthSessions(days=7) {
  const cutoff=Date.now()-days*86400000;
  return state.history.filter(session=>nexset360IsStrengthSession(session)&&new Date(session.startedAt).getTime()>=cutoff);
}

/* ---------- State migration ---------- */
function nexset400NormalizeTrainingStatus(raw) {
  if (!isPlainObject(raw)) return null;
  const remaining = Math.max(0,Math.trunc(Number(raw.remainingStrengthSessions)||0));
  if (!remaining) return null;
  const createdAt=validDateOr(raw.createdAt);
  if (nexset400DaysAgo(createdAt)>14) return null;
  return {
    id:String(raw.id||nexset400Id('status')),
    mode:['return','light','caution'].includes(raw.mode)?raw.mode:'light',
    reason:String(raw.reason||'recovery'),
    label:String(raw.label||'Reduced session'),
    note:String(raw.note||''),
    loadMultiplier:clamp(Number(raw.loadMultiplier)||.92,.6,1),
    cardioMultiplier:clamp(Number(raw.cardioMultiplier)||.85,.5,1),
    setReduction:clamp(Math.trunc(Number(raw.setReduction)||1),0,3),
    remainingStrengthSessions:remaining,
    createdAt,
    autoApply:Boolean(raw.autoApply),
    requiresConfirm:Boolean(raw.requiresConfirm),
    source:String(raw.source||'manual')
  };
}
function nexset400Migrate() {
  state.settings = state.settings || {};
  if (state.settings.nexsetSmithResistancePreset !== '25-lb-personal') {
    state.settings.smithBarWeight = 25;
    state.settings.nexsetSmithResistancePreset = '25-lb-personal';
  }
  const priorCoachPlanVersion = String(state.settings.nexsetCoachPlanVersion || '');
  const coachPlan = nexset360CoachPlan();
  nexset350InstallPlan(PLAN, coachPlan);
  const hasSavedPlan = Array.isArray(state.programPlan) && state.programPlan.length >= 7;
  if (!hasSavedPlan || !['3.6.1', '4.0.0', '4.0.1', '4.0.2', '4.0.3', NEXSET_400_VERSION].includes(priorCoachPlanVersion)) {
    state.programPlan = deepClone(coachPlan);
    state.settings.currentDayIndex = clamp(Math.trunc(Number(state.settings.currentDayIndex)||0),0,coachPlan.length-1);
  }
  state.goals = state.goals || {};
  state.dailyCheckins = nexset400SafeArray(state.dailyCheckins).slice(-365);
  state.achievements = nexset400SafeArray(state.achievements).filter(isPlainObject).slice(-100);
  state.photoMeta = nexset400SafeArray(state.photoMeta).filter(isPlainObject).slice(-NEXSET_400_MAX_PHOTOS);
  state.trainingStatus = nexset400NormalizeTrainingStatus(state.trainingStatus);
  state.settings.readinessEnabled = state.settings.readinessEnabled !== false;
  state.settings.autoReturnMode = state.settings.autoReturnMode !== false;
  state.settings.weeklyStrengthTarget = clamp(Math.trunc(Number(state.settings.weeklyStrengthTarget)||5),1,7);
  state.settings.weeklyCardioTarget = clamp(Math.trunc(Number(state.settings.weeklyCardioTarget)||120),0,500);
  state.settings.nexsetCoachPlanVersion = NEXSET_400_VERSION;
  state.settings.programStyle = 'rolling-five-day-smart';
  state.goals.weeklyStrengthDays = clamp(Math.trunc(Number(state.goals.weeklyStrengthDays)||state.settings.weeklyStrengthTarget||5),1,7);
  state.goals.weeklyCardioMinutes = clamp(Math.trunc(Number(state.goals.weeklyCardioMinutes)||state.settings.weeklyCardioTarget||120),0,500);
  state.goals.targetRunMinutes = clamp(Number(state.goals.targetRunMinutes)||20,0,120);
  state.goals.targetSmithBench = Math.max(0,Number(state.goals.targetSmithBench)||185);
  state.goals.targetSquat = Math.max(0,Number(state.goals.targetSquat)||185);
  state.goals.targetWeight = Math.max(0,Number(state.goals.targetWeight)||200);
  state.goals.targetBodyFat = Math.max(0,Number(state.goals.targetBodyFat)||18);
  for (const session of state.history) {
    session.records = nexset400SafeArray(session.records);
    session.achievementsUnlocked = nexset400SafeArray(session.achievementsUnlocked);
    if (session.trainingModifier) session.trainingModifier.preserveProgression = session.trainingModifier.preserveProgression !== false;
  }
  state.version = DATA_SCHEMA_VERSION;
  nexset400RefreshAchievements(false);
  saveState({reason:'4.0.3-migration',snapshot:false});
}

/* ---------- Readiness ---------- */
function nexset400TodayCheckin() {
  const key=dateKey();
  return [...nexset400SafeArray(state.dailyCheckins)].reverse().find(item=>dateKey(item.date||item.createdAt)===key) || null;
}
function nexset400ReadinessScore(checkin) {
  if (!checkin) return null;
  const sleep=clamp(Number(checkin.sleep)||3,1,5);
  const energy=clamp(Number(checkin.energy)||3,1,5);
  const soreness=clamp(Number(checkin.soreness)||3,1,5);
  const stress=clamp(Number(checkin.stress)||3,1,5);
  let score=((sleep+energy+(6-soreness)+(6-stress))/20)*100;
  if (checkin.illness) score-=28;
  if (checkin.pain) score-=20;
  return nexset400Percent(score);
}
function nexset400PassiveReadiness() {
  let score=78;
  const latest=nexset400LatestStrengthSession();
  if (latest) {
    const hours=nexset400HoursAgo(latest.startedAt);
    if (hours<18) score-=22;
    else if (hours<30) score-=12;
    else if (hours<48) score-=4;
    else if (hours>72) score+=5;
    const logs=(latest.exercises||[]).flatMap(entry=>workingLogs(entry.logs||[]));
    const hard=logs.filter(log=>log.feel==='hard').length;
    if (logs.length && hard/logs.length>.4) score-=9;
  }
  const recentMissed=[...state.history].filter(nexset360IsMissedSession).sort((a,b)=>new Date(b.startedAt)-new Date(a.startedAt))[0];
  if (recentMissed && nexset400DaysAgo(recentMissed.startedAt)<3) {
    if (recentMissed.missedReason==='sick') score-=18;
    else if (recentMissed.missedReason==='recovery') score-=9;
    else if (recentMissed.missedReason==='pain') score-=15;
  }
  if (state.trainingStatus) score-=8;
  return nexset400Percent(score);
}
function nexset400ReadinessLabel(score) {
  if (score>=85) return {label:'Primed',detail:'Subjective readiness looks high. Train with normal targets.'};
  if (score>=70) return {label:'Ready',detail:'Normal training is reasonable. Keep the planned reps in reserve.'};
  if (score>=55) return {label:'Controlled',detail:'Train, but keep effort tidy and avoid unnecessary grinders.'};
  if (score>=40) return {label:'Light day',detail:'A reduced session may fit better than chasing normal volume.'};
  return {label:'Recovery first',detail:'Consider recovery or a very light session. This is not a medical assessment.'};
}
function nexset400ReadinessSnapshot() {
  const checkin=nexset400TodayCheckin();
  const score=checkin?nexset400ReadinessScore(checkin):nexset400PassiveReadiness();
  const label=nexset400ReadinessLabel(score);
  return {score,...label,source:checkin?'check-in':'training estimate',checkin};
}
function nexset400RangeLabel(kind,value) {
  const labels={
    sleep:['Very poor','Poor','Okay','Good','Great'],
    energy:['Drained','Low','Okay','Good','High'],
    soreness:['None','Light','Moderate','High','Very high'],
    stress:['Very low','Low','Moderate','High','Very high']
  };
  return labels[kind]?.[clamp(Math.round(Number(value)||3),1,5)-1] || cleanNumber(value);
}
function nexset400OpenReadinessSheet() {

/* ---------- Muscle recovery estimate ---------- */
const NEXSET_400_MUSCLES = [
  {id:'chest',label:'Chest'}, {id:'back',label:'Back'}, {id:'shoulders',label:'Shoulders'}, {id:'arms',label:'Arms'},
  {id:'quads',label:'Quads'}, {id:'hamstrings',label:'Hamstrings'}, {id:'glutes',label:'Glutes'}, {id:'calves',label:'Calves'}, {id:'core',label:'Core'}
];
function nexset400MusclesForExercise(ex) {
  const group=movementGroup(ex);
  const map={
    horizontal_push:['chest','shoulders','arms'],vertical_push:['shoulders','arms'],lateral_raise:['shoulders'],
    vertical_pull:['back','arms'],horizontal_pull:['back','arms'],biceps:['arms'],triceps:['arms'],
    squat:['quads','glutes'],leg_press:['quads','glutes'],knee_extension:['quads'],hinge:['hamstrings','glutes'],
    knee_flexion:['hamstrings'],hip_extension:['glutes','hamstrings'],hip_abduction:['glutes'],calves:['calves'],core:['core']
  };
  return map[group]||[];
}
function nexset400MuscleRecovery() {
  const result=Object.fromEntries(NEXSET_400_MUSCLES.map(meta=>[meta.id,{...meta,lastAt:null,sets:0,hard:0,score:100,requiredHours:0}]));
  const sessions=[...state.history].filter(nexset360IsStrengthSession).sort((a,b)=>new Date(a.startedAt)-new Date(b.startedAt));
  for(const session of sessions){
    const counts={};
    for(const entry of session.exercises||[]){const ex=entryExercise(entry);if(!ex)continue;const logs=workingLogs(entry.logs||[]);if(!logs.length)continue;for(const muscle of nexset400MusclesForExercise(ex)){counts[muscle]=counts[muscle]||{sets:0,hard:0};counts[muscle].sets+=logs.length;counts[muscle].hard+=logs.filter(log=>log.feel==='hard').length;}}
    for(const [muscle,data] of Object.entries(counts)){const item=result[muscle];if(!item)continue;item.lastAt=session.startedAt;item.sets=data.sets;item.hard=data.hard;}
  }
  for(const item of Object.values(result)){
    if(!item.lastAt)continue;
    item.requiredHours=clamp(30+item.sets*3+item.hard*5,30,84);
    item.score=nexset400Percent((nexset400HoursAgo(item.lastAt)/item.requiredHours)*100);
    item.status=item.score>=85?'Ready':item.score>=60?'Recovering':'Low';
  }
  return Object.values(result);
}

/* ---------- Progression, records, coaching, achievements ---------- */
function nexset400ExercisePerformance(entry) {
  const ex=entryExercise(entry);if(!ex)return null;
  const logs=workingLogs(entry.logs||[]);
  if(ex.type==='weighted'){
    const valid=logs.filter(log=>Number.isFinite(Number(log.weight))&&Number.isFinite(Number(log.reps)));
    if(!valid.length)return null;
    const maxWeight=Math.max(...valid.map(log=>Number(log.weight)));
    const maxReps=Math.max(...valid.map(log=>Number(log.reps)));
    const e1rm=Math.max(...valid.map(log=>Number(log.weight)*(1+Number(log.reps)/30)));
    const volume=valid.reduce((sum,log)=>sum+Number(log.weight)*Number(log.reps),0);
    return{type:'weighted',maxWeight,maxReps,e1rm,volume};
  }
  if(ex.type==='bodyweight'){
    if(!logs.length)return null;return{type:'bodyweight',maxReps:Math.max(...logs.map(log=>Number(log.reps)||0)),volume:logs.reduce((sum,log)=>sum+(Number(log.reps)||0),0)};
  }
  if(ex.type==='cardio'){
    if(!logs.length)return null;const log=logs.at(-1);return{type:'cardio',duration:Number(log.duration)||0,speed:Number(log.speed)||0,incline:Number(log.incline)||0,level:Number(log.level)||0,jogSpeed:Number(log.jogSpeed)||0,rounds:Number(log.rounds)||0,distance:Number(log.distance)||0};
  }
  return null;
}
function nexset400PriorExerciseBest(exerciseId,history) {
  const performances=[];
  for(const session of history)for(const entry of session.exercises||[])if(entry.id===exerciseId){const p=nexset400ExercisePerformance(entry);if(p)performances.push(p);}
  if(!performances.length)return null;
  const type=performances[0].type;
  if(type==='weighted')return{type,maxWeight:Math.max(...performances.map(p=>p.maxWeight)),maxReps:Math.max(...performances.map(p=>p.maxReps)),e1rm:Math.max(...performances.map(p=>p.e1rm)),volume:Math.max(...performances.map(p=>p.volume))};
  if(type==='bodyweight')return{type,maxReps:Math.max(...performances.map(p=>p.maxReps)),volume:Math.max(...performances.map(p=>p.volume))};
  return{type,duration:Math.max(...performances.map(p=>p.duration)),speed:Math.max(...performances.map(p=>p.speed||0)),incline:Math.max(...performances.map(p=>p.incline||0)),level:Math.max(...performances.map(p=>p.level||0)),jogSpeed:Math.max(...performances.map(p=>p.jogSpeed||0)),rounds:Math.max(...performances.map(p=>p.rounds||0)),distance:Math.max(...performances.map(p=>p.distance||0))};
}
function nexset400BuildSessionRecords(session,priorHistory) {
  const records=[];

    const ex=entryExercise(entry),current=nexset400ExercisePerformance(entry);if(!ex||!current)continue;
    const prior=nexset400PriorExerciseBest(entry.id,priorHistory);if(!prior)continue;
    if(current.type==='weighted'){
      if(current.e1rm>prior.e1rm*1.005)records.push({id:nexset400Id('record'),exerciseId:entry.id,name:ex.name,type:'Estimated strength PR',value:`${cleanNumber(fromStorageWeight(current.e1rm).toFixed(1))} ${displayWeightUnit()} e1RM`,icon:'🏆'});
      else if(current.maxWeight>prior.maxWeight+.01)records.push({id:nexset400Id('record'),exerciseId:entry.id,name:ex.name,type:'Weight PR',value:formatWeightValue(current.maxWeight),icon:'⬆'});
      if(current.volume>prior.volume*1.02)records.push({id:nexset400Id('record'),exerciseId:entry.id,name:ex.name,type:'Exercise volume PR',value:`${formatVolumeValue(current.volume)} ${displayWeightUnit()}`,icon:'◆'});
    }else if(current.type==='bodyweight'&&current.maxReps>prior.maxReps)records.push({id:nexset400Id('record'),exerciseId:entry.id,name:ex.name,type:'Rep PR',value:`${current.maxReps} reps`,icon:'🏆'});
    else if(current.type==='cardio'){
      if(current.duration>prior.duration+.01)records.push({id:nexset400Id('record'),exerciseId:entry.id,name:ex.name,type:'Duration PR',value:`${cleanNumber(current.duration)} min`,icon:'⏱'});
      else if(current.jogSpeed>prior.jogSpeed+.01)records.push({id:nexset400Id('record'),exerciseId:entry.id,name:ex.name,type:'Jog speed PR',value:`${cleanNumber(current.jogSpeed)} mph`,icon:'🏃'});
      else if(current.level>prior.level+.01)records.push({id:nexset400Id('record'),exerciseId:entry.id,name:ex.name,type:'Level PR',value:`Level ${cleanNumber(current.level)}`,icon:'↗'});
    }
  }
  const seen=new Set();return records.filter(record=>{const key=`${record.exerciseId}-${record.type}`;if(seen.has(key))return false;seen.add(key);return true;}).slice(0,12);
}
function nexset400SessionHardPercent(session) {

function nexset400GenerateCoachSummary(session,priorHistory) {

/* ---------- Guided cardio timer ---------- */
function nexset400TimerPhases(ex,entry) {
  const config=nexset343CardioConfig(ex),phases=[];
  if(config.mode==='interval'){
    const rounds=Math.max(1,Math.round(Number(entry.draftRounds)||config.roundsMin));

startWorkout = function() {

};
saveMissedDay = function() {

  if(['sick','recovery','pain'].includes(reason)){state.trainingStatus=nexset400StatusForReason(reason,'missed-day');saveState({reason:'missed-day-return-mode'});render();}
};
rebuildProgress = function() {
  state.exerciseProgress={};

  for(const session of sessions){if(session.trainingModifier?.preserveProgression)continue;for(const entry of session.exercises||[]){const ex=entryExercise(entry),logs=entry.logs||[];if(ex&&logs.length)state.exerciseProgress[entry.id]=analyzeExercise(ex,logs,state.exerciseProgress[entry.id]||{});}}
  nexset360SeedRecommendations(getPlan(),false);
};

  if(!active)return;const activeId=active.id,modifier=active.trainingModifier?deepClone(active.trainingModifier):null,readiness=active.readinessSnapshot||nexset400ReadinessSnapshot();
  nexset400FinishWorkoutBase();
  const completed=lastCompletedSession;if(!completed||completed.id!==activeId)return;
  const session=state.history.find(item=>item.id===activeId)||completed;
  session.trainingModifier=modifier;session.readinessSnapshot=readiness;
  rebuildProgress();
  const prior=state.history.filter(item=>item.id!==session.id);session.records=nexset400BuildSessionRecords(session,prior);session.coachSummary=nexset400GenerateCoachSummary(session,prior);
  if(modifier&&state.trainingStatus&&modifier.id===state.trainingStatus.id){state.trainingStatus.remainingStrengthSessions=Math.max(0,Number(state.trainingStatus.remainingStrengthSessions)-1);if(!state.trainingStatus.remainingStrengthSessions)state.trainingStatus=null;}
  session.achievementsUnlocked=nexset400RefreshAchievements(true);lastCompletedSession=session;saveState({reason:'4.0-session-analysis'});render();
};

/* ---------- NEXSET 4.0.4 calendar-aware rolling workout dates ---------- */
const nexset404RenderPlanBase = renderPlan;
const nexset404RenderHomeBase = renderHome;
const nexset404RenderWorkoutPreviewBase = renderWorkoutPreview;
const nexset404OpenMissedDayBase = openMissedDaySheet;

function nexset404Midnight(value=new Date()) {
  const date=new Date(value);date.setHours(0,0,0,0);return date;
}
function nexset404AddDays(value,amount) {
  const date=nexset404Midnight(value);date.setDate(date.getDate()+Number(amount||0));return date;
}
function nexset404StartOfWeek(value=new Date()) {
  const date=nexset404Midnight(value);return nexset404AddDays(date,-((date.getDay()+6)%7));
}
function nexset404RelativeDate(date,value=new Date()) {
  const diff=Math.round((nexset404Midnight(date)-nexset404Midnight(value))/86400000);
  if(diff===0)return 'Today';
  if(diff===1)return 'Tomorrow';
  return new Date(date).toLocaleDateString(undefined,{weekday:'short'});
}
function nexset404DateLabel(date,value=new Date(),activeNow=false) {
  const target=nexset404Midnight(date),weekday=target.toLocaleDateString(undefined,{weekday:'short'}).toUpperCase(),month=target.toLocaleDateString(undefined,{month:'short'}).toUpperCase(),day=target.getDate(),diff=Math.round((target-nexset404Midnight(value))/86400000);
  if(activeNow)return `IN PROGRESS · ${weekday} ${day}`;
  if(diff===0)return `TODAY · ${weekday} ${day}`;
  if(diff===1)return `TOMORROW · ${weekday} ${day}`;
  return `${weekday} · ${month} ${day}`;
}
function nexset404PlannedSessionForDate(value) {
  const key=dateKey(value);
  const sessions=state.history.filter(session=>Number.isFinite(Number(session?.dayIndex))&&Number(session.dayIndex)>=0&&dateKey(session.startedAt)===key).sort((a,b)=>new Date(a.completedAt||a.endedAt||a.startedAt)-new Date(b.completedAt||b.endedAt||b.startedAt));
  return sessions.filter(session=>!nexset360IsMissedSession(session)).at(-1)||sessions.filter(nexset360IsMissedSession).at(-1)||null;
}
function nexset404SessionStatus(session) {
  if(!session)return '';
  if(nexset360IsMissedSession(session))return 'missed';
  if(nexset360IsRecoverySession(session))return 'complete-recovery';
  return 'complete';
}
function nexset404Schedule(value=new Date()) {
  const plan=getPlan(),today=nexset404Midnight(value),todayKey=dateKey(today),todaySession=nexset404PlannedSessionForDate(today);
  const activeSlot=active?{
    date:today,
    status:'active-session',
    planIndex:Number.isFinite(Number(active.dayIndex))&&Number(active.dayIndex)>=0?Number(active.dayIndex):null,
    day:Number.isFinite(Number(active.day))?Number(active.day):null,
    title:active.title||'Workout in progress',
    focus:active.focus||'',
    type:active.isQuick?'quick':active.type==='rest'?'rest':'lift',
    active:true
  }:null;
  let startDate=today,startIndex=state.settings.currentDayIndex;
  if(activeSlot){
    startDate=nexset404AddDays(today,1);
    if(activeSlot.planIndex!==null&&!active?.isQuick)startIndex=(activeSlot.planIndex+1)%plan.length;
  }else if(todaySession){
    startDate=nexset404AddDays(today,1);
  }
  const scheduled=[];let index=((Number(startIndex)||0)+plan.length)%plan.length;
  for(let offset=0;offset<21;offset++){
    const date=nexset404AddDays(startDate,offset),day=plan[index];
    scheduled.push({date,status:offset===0?'queued':'future',planIndex:index,day:day.day,title:day.title,focus:day.focus,type:day.type,planDay:day});
    index=(index+1)%plan.length;
  }
  const upcoming=activeSlot?[activeSlot,...scheduled]:scheduled;
  const weekStart=nexset404StartOfWeek(today),week=[];
  for(let offset=0;offset<7;offset++){
    const date=nexset404AddDays(weekStart,offset),key=dateKey(date),isToday=key===todayKey,isPast=date<today;
    let item=null;
    if(isToday&&activeSlot)item={...activeSlot};
    else {
      const actual=nexset404PlannedSessionForDate(date);
      if(actual){const planIndex=Number(actual.dayIndex),day=plan[planIndex]||null;item={date,status:nexset404SessionStatus(actual),planIndex,day:Number(actual.day)||day?.day||null,title:actual.plannedTitle||actual.title||day?.title||'Workout',focus:actual.focus||day?.focus||'',type:nexset360IsRecoverySession(actual)?'rest':nexset360IsMissedSession(actual)?'missed':'lift',reason:actual.missedReasonLabel||nexset360ReasonLabel(actual.missedReason),actual};}
    }
    if(!item&&!isPast){const projected=scheduled.find(slot=>dateKey(slot.date)===key);if(projected)item={...projected};}
    week.push(item?{...item,date,isToday,isPast}:{date,status:isPast?'empty-past':'empty',isToday,isPast});
  }
  return{plan,today,todaySession,activeSlot,scheduled,upcoming,first:upcoming[0],week};
}
function nexset404Rotation(slot,schedule) {
  if(Number.isFinite(Number(slot?.day)))return Number(slot.day);
  if(Number.isFinite(Number(slot?.planIndex)))return Number(slot.planIndex)+1;
  return null;
}
function nexset404PlanTag(slot) {
  if(slot?.type==='quick')return 'QUICK';
  if(slot?.type==='rest')return 'REST';
  const rotation=Number.isFinite(Number(slot?.day))?Number(slot.day):Number.isFinite(Number(slot?.planIndex))?Number(slot.planIndex)+1:null;
  return rotation?`D${rotation}`:'—';
}
function nexset404CalendarMarkup(schedule) {
  const firstKey=dateKey(schedule.first.date);
  const cells=schedule.week.map(slot=>{
    const weekday=slot.date.toLocaleDateString(undefined,{weekday:'short'}).slice(0,1).toUpperCase(),isNext=dateKey(slot.date)===firstKey&&(slot.status==='queued'||slot.status==='active-session');
    const status=isNext&&slot.status==='future'?'queued':slot.status;
    const icon=status==='active-session'?'▶':status==='complete'||status==='complete-recovery'?'✓':status==='missed'?'!':status==='queued'?'•':'';
    const title=slot.title?`${slot.date.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}: ${slot.title}`:`${slot.date.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}: no entry`;
    return `<div class="n4-calendar-day ${status} ${slot.isToday?'today':''}" role="listitem" ${slot.isToday?'aria-current="date"':''} aria-label="${esc(title)}"><span class="n4-calendar-weekday">${weekday}</span><strong>${slot.date.getDate()}</strong><small>${esc(nexset404PlanTag(slot))}</small>${icon?`<i>${icon}</i>`:''}</div>`;
  }).join('');

  state.nutrition=nexset420NormalizeNutrition(state.nutrition);const key=nexset420SelectedDate(),entries=nexset420EntriesFor(key),totals=nexset420Totals(key),targets=nexset420Targets(),calPct=nexset420Percent(totals.calories,targets.calories),calLeft=nexset420Round(targets.calories-totals.calories);
  const grouped={breakfast:[],lunch:[],dinner:[],snack:[]};entries.forEach(entry=>(grouped[entry.meal]||grouped.snack).push(entry));
  $('#view').innerHTML=`<div class="stack n42-nutrition-screen"><section class="n42-nutrition-head"><div><div class="eyebrow">Jacked + Lean</div><h1>Nutrition</h1><p>Track calories and macros without turning the app into a complicated food database.</p></div></section><div class="n42-date-nav"><button data-action="n42-date" data-delta="-1" aria-label="Previous day">‹</button><div class="n42-date-label">${esc(nexset420DateLabel(key))}</div><button data-action="n42-date" data-delta="1" aria-label="Next day">›</button></div><section class="n42-calorie-card"><div class="n42-calorie-grid"><div class="n42-ring" style="--pct:${calPct}"><div class="n42-ring-copy"><strong>${Math.round(totals.calories)}</strong><small>of ${targets.calories} cal</small></div></div><div class="n42-calorie-copy"><span>Daily target</span><h2>${calLeft>=0?`${Math.abs(Math.round(calLeft))} calories left`:`${Math.abs(Math.round(calLeft))} over target`}</h2><p>Starting goal: fat loss with enough fuel for five lifting days and cardio.</p></div></div><div class="n42-macro-grid">${nexset420MacroMarkup('Protein',totals.protein,targets.protein)}${nexset420MacroMarkup('Carbs',totals.carbs,targets.carbs)}${nexset420MacroMarkup('Fat',totals.fat,targets.fat)}</div><div class="n42-action-grid"><button class="primary" data-action="n42-add-food">+ Add food</button><button data-action="n42-copy-yesterday">Copy yesterday</button><button data-action="n42-targets">Targets</button></div></section><div class="n42-section-head"><div><span>Fast logging</span><h2>Quick foods & cookbook meals</h2></div><small>Per serving<br>editable</small></div><div class="n42-preset-grid">${NEXSET_420_RECIPES.map(nexset420PresetMarkup).join('')}</div><div class="n42-section-head"><div><span>Food log</span><h2>${entries.length} item${entries.length===1?'':'s'}</h2></div><small>${Math.round(totals.calories)} total calories</small></div>${['breakfast','lunch','dinner','snack'].map(meal=>nexset420MealMarkup(meal,grouped[meal])).join('')}<div class="n42-disclaimer"><strong>Tracking note:</strong> cookbook presets use the macros printed in the PDF. Product labels, ingredient brands, and your weighed finished portions can change the real totals, so edit an entry whenever your package labels differ.</div></div>`;
}

function nexset420CloseSheet(){document.querySelector('.n42-sheet')?.remove();}
function nexset420FoodSheetTotal(){
  const sheet=document.querySelector('.n42-sheet');if(!sheet)return;const servings=Math.max(.05,nexset420Number(sheet.querySelector('[name="servings"]')?.value,1));const fields=['calories','protein','carbs','fat'];const values=Object.fromEntries(fields.map(field=>[field,nexset420Number(sheet.querySelector(`[name="${field}"]`)?.value,0)*servings]));const target=sheet.querySelector('#n42SheetTotals');if(target)target.innerHTML=`<span><b>${Math.round(values.calories)}</b>cal</span><span><b>${nexset420FormatMacro(values.protein)}</b>protein</span><span><b>${nexset420FormatMacro(values.carbs)}</b>carbs</span><span><b>${nexset420FormatMacro(values.fat)}</b>fat</span>`;
}
function nexset420OpenFoodSheet(entry=null,preset=null){
  nexset420CloseSheet();const source=entry||preset||{meal:'snack',name:'',servings:1,calories:0,protein:0,carbs:0,fat:0};document.body.insertAdjacentHTML('beforeend',`<div class="sheet-backdrop n42-sheet" data-action="n42-close-sheet"><section class="bottom-sheet" role="dialog" aria-modal="true" aria-label="${entry?'Edit':'Add'} food"><div class="sheet-handle"></div><div class="sheet-head"><div><span class="section-kicker">Nutrition log</span><h2>${entry?'Edit food':'Add food'}</h2><p class="muted">Enter values per serving. NEXSET multiplies them by your serving amount.</p></div><button class="sheet-close" data-action="n42-close-sheet">×</button></div><div class="n42-sheet-grid"><div class="n42-field wide"><label>Food or meal</label><input name="name" maxlength="120" value="${esc(source.name||'')}" placeholder="Chicken, rice, smoothie…"></div><div class="n42-field"><label>Meal</label><select name="meal">${['breakfast','lunch','dinner','snack'].map(meal=>`<option value="${meal}" ${source.meal===meal?'selected':''}>${nexset420MealLabel(meal)}</option>`).join('')}</select></div><div class="n42-field"><label>Servings</label><input name="servings" type="number" min="0.05" max="50" step="0.25" inputmode="decimal" value="${nexset420FormatMacro(source.servings||1)}"></div><div class="n42-field"><label>Calories / serving</label><input name="calories" type="number" min="0" max="10000" step="1" inputmode="decimal" value="${nexset420FormatMacro(source.calories||0)}"></div><div class="n42-field"><label>Protein (g)</label><input name="protein" type="number" min="0" max="1000" step="0.1" inputmode="decimal" value="${nexset420FormatMacro(source.protein||0)}"></div><div class="n42-field"><label>Carbs (g)</label><input name="carbs" type="number" min="0" max="2000" step="0.1" inputmode="decimal" value="${nexset420FormatMacro(source.carbs||0)}"></div><div class="n42-field"><label>Fat (g)</label><input name="fat" type="number" min="0" max="1000" step="0.1" inputmode="decimal" value="${nexset420FormatMacro(source.fat||0)}"></div></div><div class="n42-sheet-total" id="n42SheetTotals"></div><button class="btn primary block" data-action="n42-save-food" data-id="${entry?esc(entry.id):''}">${entry?'Save changes':'Add to day'}</button></section></div>`);nexset420FoodSheetTotal();setTimeout(()=>document.querySelector('.n42-sheet [name="name"]')?.focus(),60);
}
function nexset420SaveFood(id=''){
  const sheet=document.querySelector('.n42-sheet');if(!sheet)return;const name=String(sheet.querySelector('[name="name"]')?.value||'').trim();if(!name){showToast('Enter a food or meal name.');return;}
  const data={date:nexset420SelectedDate(),meal:String(sheet.querySelector('[name="meal"]')?.value||'snack'),name,servings:Math.max(.05,nexset420Number(sheet.querySelector('[name="servings"]')?.value,1)),calories:Math.max(0,nexset420Number(sheet.querySelector('[name="calories"]')?.value,0)),protein:Math.max(0,nexset420Number(sheet.querySelector('[name="protein"]')?.value,0)),carbs:Math.max(0,nexset420Number(sheet.querySelector('[name="carbs"]')?.value,0)),fat:Math.max(0,nexset420Number(sheet.querySelector('[name="fat"]')?.value,0))};
  const index=state.nutrition.entries.findIndex(entry=>entry.id===id);if(index>=0)state.nutrition.entries[index]={...state.nutrition.entries[index],...data};else state.nutrition.entries.push({id:crypto.randomUUID?.()||`nutrition-${Date.now()}-${Math.random().toString(16).slice(2)}`,...data,createdAt:new Date().toISOString()});
  saveState({reason:index>=0?'nutrition-edit':'nutrition-add'});nexset420CloseSheet();render();showToast(index>=0?'Food updated.':'Food added.');
}
function nexset420QuickAdd(id){const recipe=NEXSET_420_RECIPES.find(item=>item.id===id);if(!recipe)return;state.nutrition.entries.push({id:crypto.randomUUID?.()||`nutrition-${Date.now()}-${Math.random().toString(16).slice(2)}`,date:nexset420SelectedDate(),meal:recipe.meal,name:recipe.name,servings:1,calories:recipe.calories,protein:recipe.protein,carbs:recipe.carbs,fat:recipe.fat,createdAt:new Date().toISOString()});saveState({reason:'nutrition-quick-add'});render();showToast(`${recipe.name} added.`);}
function nexset420DeleteFood(id){const entry=state.nutrition.entries.find(item=>item.id===id);if(!entry)return;if(!confirm(`Delete ${entry.name}?`))return;state.nutrition.entries=state.nutrition.entries.filter(item=>item.id!==id);saveState({reason:'nutrition-delete'});render();showToast('Food deleted.');}
function nexset420ChangeDate(delta){const date=nexset420DateFromKey(nexset420SelectedDate());date.setDate(date.getDate()+Number(delta||0));state.nutrition.selectedDate=dateKey(date);saveState({reason:'nutrition-date',snapshot:false});render();}
function nexset420CopyYesterday(){
  const current=nexset420DateFromKey(nexset420SelectedDate()),prior=new Date(current);prior.setDate(prior.getDate()-1);const source=nexset420EntriesFor(dateKey(prior));if(!source.length){showToast('No food was logged yesterday.');return;}if(nexset420EntriesFor(nexset420SelectedDate()).length&&!confirm('Add yesterday’s entries to the food already logged today?'))return;for(const item of source)state.nutrition.entries.push({...deepClone(item),id:crypto.randomUUID?.()||`nutrition-${Date.now()}-${Math.random().toString(16).slice(2)}`,date:nexset420SelectedDate(),createdAt:new Date().toISOString()});saveState({reason:'nutrition-copy-yesterday'});render();showToast(`${source.length} item${source.length===1?'':'s'} copied.`);
}
function nexset420OpenTargets(){const target=nexset420Targets();nexset420CloseSheet();document.body.insertAdjacentHTML('beforeend',`<div class="sheet-backdrop n42-sheet" data-action="n42-close-sheet"><section class="bottom-sheet" role="dialog" aria-modal="true" aria-label="Nutrition targets"><div class="sheet-handle"></div><div class="sheet-head"><div><span class="section-kicker">Daily goals</span><h2>Macro targets</h2><p class="muted">Starting targets calculated for your current cut and muscle-building plan.</p></div><button class="sheet-close" data-action="n42-close-sheet">×</button></div><div class="n42-sheet-grid"><div class="n42-field wide"><label>Calories</label><input name="targetCalories" type="number" min="1000" max="6000" step="25" inputmode="numeric" value="${target.calories}"></div><div class="n42-field"><label>Protein (g)</label><input name="targetProtein" type="number" min="0" max="500" step="5" inputmode="numeric" value="${target.protein}"></div><div class="n42-field"><label>Carbs (g)</label><input name="targetCarbs" type="number" min="0" max="1000" step="5" inputmode="numeric" value="${target.carbs}"></div><div class="n42-field wide"><label>Fat (g)</label><input name="targetFat" type="number" min="0" max="300" step="5" inputmode="numeric" value="${target.fat}"></div></div><p class="n42-target-note">Macro calories do not always equal the calorie target exactly because labels round values. Use the calorie target as the main ceiling and protein as the first macro to hit.</p><button class="btn primary block" data-action="n42-save-targets">Save targets</button></section></div>`);}
function nexset420SaveTargets(){const sheet=document.querySelector('.n42-sheet');if(!sheet)return;state.goals.dailyCalories=Math.max(1000,Math.round(nexset420Number(sheet.querySelector('[name="targetCalories"]')?.value,2400)));state.goals.dailyProtein=Math.max(0,Math.round(nexset420Number(sheet.querySelector('[name="targetProtein"]')?.value,200)));state.goals.dailyCarbs=Math.max(0,Math.round(nexset420Number(sheet.querySelector('[name="targetCarbs"]')?.value,230)));state.goals.dailyFat=Math.max(0,Math.round(nexset420Number(sheet.querySelector('[name="targetFat"]')?.value,75)));saveState({reason:'nutrition-targets'});nexset420CloseSheet();render();showToast('Nutrition targets saved.');}

function nexset420WeeklyNutrition(){
  const today=new Date();today.setHours(12,0,0,0);const days=[];for(let i=6;i>=0;i--){const date=new Date(today);date.setDate(today.getDate()-i);const key=dateKey(date),totals=nexset420Totals(key);if(nexset420EntriesFor(key).length)days.push({key,...totals});}
  if(!days.length)return{loggedDays:0,averages:null};const sums=days.reduce((sum,day)=>{sum.calories+=day.calories;sum.protein+=day.protein;sum.carbs+=day.carbs;sum.fat+=day.fat;return sum;},{calories:0,protein:0,carbs:0,fat:0});return{loggedDays:days.length,averages:Object.fromEntries(Object.entries(sums).map(([key,value])=>[key,value/days.length]))};
}
function nexset420NutritionReportSection(){const today=nexset420Totals(dateKey()),targets=nexset420Targets(),week=nexset420WeeklyNutrition();return['',`NUTRITION`,`Targets: ${targets.calories} calories | ${targets.protein}g protein | ${targets.carbs}g carbs | ${targets.fat}g fat`,`Today: ${Math.round(today.calories)} calories | ${nexset420FormatMacro(today.protein)}g protein | ${nexset420FormatMacro(today.carbs)}g carbs | ${nexset420FormatMacro(today.fat)}g fat`,week.averages?`7-day logged average (${week.loggedDays} day${week.loggedDays===1?'':'s'}): ${Math.round(week.averages.calories)} calories | ${nexset420FormatMacro(week.averages.protein)}g protein | ${nexset420FormatMacro(week.averages.carbs)}g carbs | ${nexset420FormatMacro(week.averages.fat)}g fat`:'7-day logged average: no nutrition days logged yet.'].join('\n');}

const nexset420MigrateBase=nexset400Migrate;
nexset400Migrate=function(){nexset420MigrateBase();nexset420Migrate();};

const nexset420RenderBase=render;
render=function(){if(currentView!=='nutrition'){nexset420RenderBase();return;}updateChrome();document.body.dataset.screen='nutrition';$$('.nav-btn').forEach(btn=>btn.classList.toggle('active',btn.dataset.nav==='nutrition'));$('#appHeader')?.classList.remove('hidden');$('#bottomNav')?.classList.remove('hidden');renderNutrition();animateView();window.scrollTo({top:0,behavior:'instant'});};

const nexset420RenderHomeBase=renderHome;
renderHome=function(){nexset420RenderHomeBase();const screen=document.querySelector('.signature-home');if(!screen||screen.querySelector('.n42-home-card'))return;const totals=nexset420Totals(dateKey()),targets=nexset420Targets();const card=`<button class="n42-home-card" data-view="nutrition"><div><span>Today’s nutrition</span><strong>${Math.round(totals.calories)} / ${targets.calories} calories</strong><small>${nexset420FormatMacro(totals.protein)} / ${targets.protein}g protein logged</small></div><b>›</b></button>`;(screen.querySelector('.n41-evening-card')||screen.querySelector('.signature-hero'))?.insertAdjacentHTML('afterend',card);};

const nexset420RenderMoreBase=renderMore;
renderMore=function(){nexset420RenderMoreBase();const version=document.querySelector('.about-nexset span');if(version)version.textContent=`NEXSET ${APP_VERSION_LABEL} · Jacked + Lean + Nutrition`;};

const nexset420CoachReportBase=coachReport;
coachReport=function(options={}){const text=nexset420CoachReportBase(options),section=nexset420NutritionReportSection();return text.includes('\n--- NEXSET_DATA_JSON ---')?text.replace('\n--- NEXSET_DATA_JSON ---',`${section}\n\n--- NEXSET_DATA_JSON ---`):`${text}${section}`;};
const nexset420WeeklyReportBase=weeklyReportText;
weeklyReportText=function(){return`${nexset420WeeklyReportBase()}${nexset420NutritionReportSection()}`;};

function nexset420HandleAction(event){
  const button=event.target.closest('[data-action]');if(!button)return;const action=button.dataset.action;if(!String(action).startsWith('n42-'))return;if(button.classList.contains('sheet-backdrop')&&event.target!==button)return;event.preventDefault();event.stopImmediatePropagation();haptic('light');
  if(action==='n42-date')nexset420ChangeDate(button.dataset.delta);
  else if(action==='n42-add-food')nexset420OpenFoodSheet();
  else if(action==='n42-edit-food')nexset420OpenFoodSheet(state.nutrition.entries.find(entry=>entry.id===button.dataset.id)||null);
  else if(action==='n42-save-food')nexset420SaveFood(button.dataset.id||'');
  else if(action==='n42-delete-food')nexset420DeleteFood(button.dataset.id);
  else if(action==='n42-quick-add')nexset420QuickAdd(button.dataset.id);
  else if(action==='n42-copy-yesterday')nexset420CopyYesterday();
  else if(action==='n42-targets')nexset420OpenTargets();
  else if(action==='n42-save-targets')nexset420SaveTargets();
  else if(action==='n42-close-sheet')nexset420CloseSheet();
}
document.addEventListener('click',nexset420HandleAction,true);
document.addEventListener('input',event=>{if(event.target.closest('.n42-sheet')&&['servings','calories','protein','carbs','fat'].includes(event.target.name))nexset420FoodSheetTotal();},true);
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.querySelector('.n42-sheet'))nexset420CloseSheet();});


nexset400Migrate();


    rebuildProgress();saveState({reason:'app-start'});saveActive({reason:'app-start',snapshot:false});render();restoreRestTimer();
    if(startupNotice)setTimeout(()=>showToast(startupNotice),450);
    window.addEventListener('load',registerServiceWorker);
  })();
</script>
</body>
